<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atmiyata Mosaic — Projection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7F1E4;
    --maroon: #5A2A1E;
    --maroon-soft: #8B3A2B;
    --marigold: #E08D3C;
    --terracotta: #C75B39;
    --sage: #6B7A5E;
    --line: rgba(90, 42, 30, 0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--cream);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(224,141,60,0.09), transparent 42%),
      radial-gradient(circle at 94% 88%, rgba(199,91,57,0.08), transparent 45%);
    font-family: 'Inter', sans-serif;
    color: var(--maroon);
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Petal shower overlay — sits above everything, never blocks input */
  #petals {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 40;
  }

  /* Top bar: live counter + status */
  .topbar {
    position: absolute;
    top: 36px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 44px;
  }

  .top-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .top-qr {
    display: none;
  }

  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.02em;
    color: var(--maroon-soft);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--marigold);
  }

  .counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.03em;
    color: var(--terracotta);
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.5);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 16px;
  }

  .counter .num {
    font-weight: 700;
    color: var(--maroon);
  }

  .counter .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--sage);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  /* Waiting state */
  #waiting {
    text-align: center;
  }

  #waiting .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--terracotta);
    margin-bottom: 20px;
  }

  #waiting h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(40px, 6vw, 72px);
    margin: 0 0 18px;
    letter-spacing: -0.01em;
  }

  #waiting h1 em {
    font-style: italic;
    font-weight: 500;
    color: var(--terracotta);
  }

  #waiting p {
    font-size: 17px;
    color: var(--maroon-soft);
    margin: 0 0 40px;
  }

  .qr-hint {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.55);
    border: 1.5px solid var(--line);
    border-radius: 16px;
    padding: 16px 26px;
  }

  .qr-hint .qr-box {
    width: 52px; height: 52px;
    border-radius: 8px;
    background: var(--maroon);
    display: flex; align-items: center; justify-content: center;
  }

  .qr-hint .qr-box svg { width: 30px; height: 30px; }

  .qr-hint span {
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    font-weight: 500;
    color: var(--maroon-soft);
    text-align: left;
  }

  /* Mosaic canvas state */
  #mosaic-wrap {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .guru-photos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .guru-photos img {
    width: clamp(78px, 18vw, 140px);
    height: auto;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 6px 20px rgba(90,42,30,0.18);
  }

  #mosaic-wrap .caption {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(90,42,30,0.45);
  }

  canvas#mosaic {
    max-width: 88vw;
    max-height: 70vh;
  }

  /* Reveal state banner */
  #reveal-banner {
    display: none;
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 40px;
    color: var(--terracotta);
    background: rgba(255,255,255,0.6);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 24px;
  }
  @media (max-width: 720px) {
    .topbar {
      flex-direction: column;
      align-items: flex-start;
      padding: 12px 18px;
      gap: 10px;
    }
    .top-right { align-items: flex-start; }
    .brand { font-size: 16px; }
    .counter { font-size: 13px; padding: 6px 10px; }
    #mosaic-wrap .caption { font-size: 11px; }
    canvas#mosaic { max-width: 94vw; }
    .guru-photos { gap: 12px; }
  }
</style>
</head>
<body>

<div class="stage">

  <canvas id="petals"></canvas>

  <div class="topbar">
    <div class="brand"><span class="dot"></span>Swikar</div>
    <div class="top-right">
      <div class="counter"><span class="pulse"></span><span class="num" id="counter-num">0</span> responses added</div>
      <div id="top-qr" class="qr-hint top-qr" aria-hidden="true">
        <div class="qr-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="#F7F1E4" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><line x1="14" y1="14" x2="14" y2="21"/><line x1="21" y1="14" x2="21" y2="21"/><line x1="17.5" y1="14" x2="17.5" y2="17.5"/><line x1="14" y1="17.5" x2="21" y2="17.5"/></svg>
        </div>
        <span>Scan this QR!</span>
      </div>
    </div>
  </div>

  <!-- WAITING STATE -->
  <div id="waiting">
    <div class="eyebrow">Scan to begin</div>
    <h1>Your voice is<br><em>part of Atmiyata.</em></h1>
    <p>Scan the code, add one thing you noticed today.</p>
    <div class="qr-hint">
      <div class="qr-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F7F1E4" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><line x1="14" y1="14" x2="14" y2="21"/><line x1="21" y1="14" x2="21" y2="21"/><line x1="17.5" y1="14" x2="17.5" y2="17.5"/><line x1="14" y1="17.5" x2="21" y2="17.5"/></svg>
      </div>
      <span>QR code renders here<br>once deployed</span>
    </div>
  </div>

  <!-- MOSAIC STATE -->
  <div id="mosaic-wrap">
    <div class="guru-photos">
      <img src="guru-1.png" alt="">
      <img src="guru-2.png" alt="">
    </div>
    <div class="caption">Many voices &middot; one Atmiyata</div>
    <canvas id="mosaic" width="1200" height="500"></canvas>
  </div>

  <div id="reveal-banner">WE ARE ONE!!</div>

</div>

<script type="module">
  import { firebaseConfig, isConfigured } from './firebase-config.js';

  const WORD = "Atmiyata";
  const canvas = document.getElementById('mosaic');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // 1. Draw the word on an offscreen canvas to use as a mask
  function getMosaicPoints(word, w, h, step) {
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    const octx = off.getContext('2d');
    octx.fillStyle = '#000';
    octx.font = "700 " + Math.floor(h * 0.62) + "px Fraunces, serif";
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.fillText(word, w / 2, h / 2 + h * 0.02);

    const data = octx.getImageData(0, 0, w, h).data;
    const points = [];
    for (let y = 0; y < h; y += step) {
      for (let x = 0; x < w; x += step) {
        const alpha = data[(y * w + x) * 4 + 3];
        if (alpha > 120) points.push({ x, y });
      }
    }
    // shuffle so fill order looks organic, not left-to-right
    for (let i = points.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [points[i], points[j]] = [points[j], points[i]];
    }
    return points;
  }

  const points = getMosaicPoints(WORD, W, H, 9);
  const colors = ['#C75B39', '#E08D3C', '#8B3A2B'];

  // How many distinct responses should we expect to fill the word?
  // Adjust `TARGET_RESPONSES` to taste (e.g., 50 people -> full word).
  const TARGET_RESPONSES = 50;
  const PARTICLES_PER_SUBMISSION = Math.max(1, Math.ceil(points.length / TARGET_RESPONSES));

  function drawMarigold(x, y, r, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2 * (i === 0 ? 0 : 1));
      ctx.beginPath();
      ctx.ellipse(0, -r * 0.55, r * 0.55, r * 0.85, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#5A2A1E';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.42, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  let filled = 0;
  let responseCount = 0;
  const counterEl = document.getElementById('counter-num');
  const topQrEl = document.getElementById('top-qr');
  const revealBanner = document.getElementById('reveal-banner');
  const waitingEl = document.getElementById('waiting');
  const mosaicWrapEl = document.getElementById('mosaic-wrap');

  // ---------- Rose petal shower (plays once, the moment the word completes) ----------
  const petalCanvas = document.getElementById('petals');
  const pctx = petalCanvas.getContext('2d');

  function sizePetalCanvas() {
    petalCanvas.width = window.innerWidth;
    petalCanvas.height = window.innerHeight;
  }
  sizePetalCanvas();
  window.addEventListener('resize', sizePetalCanvas);

  const PETAL_COLORS = ['#B23A4E', '#D9667C', '#F1A9BA', '#8B3A2B'];
  let petals = [];
  let petalSpawning = false;
  let petalAnimating = false;
  let petalsTriggered = false; // guards against re-triggering every snapshot

  function makePetal() {
    return {
      x: Math.random() * petalCanvas.width,
      y: -20 - Math.random() * 80,
      size: 9 + Math.random() * 9,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.05,
      vy: 1.1 + Math.random() * 1.7,
      swayFreq: 0.01 + Math.random() * 0.015,
      swayPhase: Math.random() * Math.PI * 2,
      color: PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)],
      opacity: 0.75 + Math.random() * 0.25
    };
  }

  function drawPetal(p) {
    pctx.save();
    pctx.translate(p.x, p.y);
    pctx.rotate(p.rot);
    pctx.globalAlpha = p.opacity;
    pctx.fillStyle = p.color;
    // simple teardrop petal shape
    pctx.beginPath();
    pctx.moveTo(0, -p.size * 0.6);
    pctx.quadraticCurveTo(p.size * 0.6, -p.size * 0.15, 0, p.size * 0.6);
    pctx.quadraticCurveTo(-p.size * 0.6, -p.size * 0.15, 0, -p.size * 0.6);
    pctx.fill();
    pctx.restore();
  }

  function petalLoop() {
    pctx.clearRect(0, 0, petalCanvas.width, petalCanvas.height);
    petals.forEach((p) => {
      p.swayPhase += p.swayFreq;
      p.x += Math.sin(p.swayPhase) * 0.6;
      p.y += p.vy;
      p.rot += p.rotSpeed;
      drawPetal(p);
    });
    petals = petals.filter((p) => p.y < petalCanvas.height + 30);

    if (petals.length > 0 || petalSpawning) {
      requestAnimationFrame(petalLoop);
    } else {
      petalAnimating = false;
    }
  }

  function startPetalShower() {
    petalSpawning = true;
    if (!petalAnimating) {
      petalAnimating = true;
      requestAnimationFrame(petalLoop);
    }
    const spawnTimer = setInterval(() => {
      for (let i = 0; i < 3; i++) petals.push(makePetal());
    }, 120);
    // rain for ~4.5s, then taper off and let the remaining petals fall clear
    setTimeout(() => {
      petalSpawning = false;
      clearInterval(spawnTimer);
    }, 4500);
  }

  function maybeCelebrate() {
    if (!petalsTriggered && filled >= points.length) {
      petalsTriggered = true;
      startPetalShower();
    }
  }

  // Points are reused once every slot is full — later submissions redraw
  // over an existing (random) point rather than being dropped. See the
  // roadmap's "overflow handling" note if you'd rather stop rendering
  // new ones once the word is full.
  function drawSubmission(index) {
    const p = points[index % points.length];
    const color = colors[index % colors.length];
    drawMarigold(p.x, p.y, 4.4, color);
  }

  function goLive() {
    waitingEl.style.display = 'none';
    mosaicWrapEl.style.display = 'flex';
    if (topQrEl) topQrEl.style.display = 'inline-flex';
  }

  // Make the mosaic canvas scale responsively to viewport width
  function resizeMosaicDisplay() {
    try {
      const displayWidth = Math.min(window.innerWidth * 0.88, canvas.width);
      const displayHeight = Math.round(displayWidth * (canvas.height / canvas.width));
      canvas.style.width = displayWidth + 'px';
      canvas.style.height = displayHeight + 'px';
    } catch (e) {
      // ignore if canvas not ready
    }
  }
  // initial sizing and on resize
  resizeMosaicDisplay();
  window.addEventListener('resize', resizeMosaicDisplay);

  if (!isConfigured) {
    // ---- DEMO MODE ----
    // No Firebase project configured yet (see firebase-config.js).
    // Wait for the user to press S once to add one thread at a time.
    console.info('[Atmiyata] Running in demo mode — no Firebase config set yet.');

    let hasGoneLive = false;
    function addDemoThread() {
      if (filled >= points.length) return;
      if (!hasGoneLive) {
        goLive();
        hasGoneLive = true;
      }
      // Add multiple particles per incoming response so N responses
      // will roughly fill the word (where N = TARGET_RESPONSES).
      for (let p = 0; p < PARTICLES_PER_SUBMISSION && filled < points.length; p++, filled++) {
        drawSubmission(filled);
      }
      responseCount += 1;
      counterEl.textContent = responseCount;
      if (filled >= points.length) revealBanner.style.display = 'block';
      maybeCelebrate();
    }

    window.addEventListener('keydown', (event) => {
      if (event.key.toLowerCase() !== 's') return;
      event.preventDefault();
      addDemoThread();
    });

  } else {
    // ---- LIVE MODE ----
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const { getFirestore, collection, doc, onSnapshot, query, orderBy } =
      await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let hasGoneLive = false;
    let acceptingSubmissions = true;

    // sessionState controls waiting -> live, and live -> "reveal" framing
    onSnapshot(doc(db, 'sessionState', 'main'), (snap) => {
      acceptingSubmissions = snap.exists() ? snap.data().acceptingSubmissions !== false : true;
      if (!hasGoneLive && filled > 0) { goLive(); hasGoneLive = true; }
      revealBanner.style.display = (!acceptingSubmissions && filled > 0) ? 'block' : 'none';
    });

    // submissions collection drives the actual mosaic fill, in arrival order
    const submissionsQuery = query(collection(db, 'submissions'), orderBy('timestamp', 'asc'));
    onSnapshot(submissionsQuery, (snapshot) => {
      if (!hasGoneLive && snapshot.size > 0) { goLive(); hasGoneLive = true; }
      // Scale the visual fill so a reasonable number of people
      // (TARGET_RESPONSES) will complete the word.
      const newFilled = Math.min(points.length, snapshot.size * PARTICLES_PER_SUBMISSION);
      filled = newFilled;
      responseCount = snapshot.size;
      ctx.clearRect(0, 0, W, H);
      for (let i = 0; i < filled; i++) drawSubmission(i);
      counterEl.textContent = responseCount;
      if (!acceptingSubmissions && filled > 0) revealBanner.style.display = 'block';
      maybeCelebrate();
    });
  }
</script>

</body>
</html>
