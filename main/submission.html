<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmiyata Mosaic Submission</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
        --cream: #F7F1E4;
        --maroon: #5A2A1E;
        --maroon-soft: #8B3A2B;
        --marigold: #E08D3C;
        --terracotta: #C75B39;
        --sage: #6B7A5E;
        --line: rgba(90, 42, 30, 0.14);
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 24px;

        font-family: 'Inter', sans-serif;
        background-color: var(--cream);
    }

    .page-container {
        max-width: 700px;
        width: 100%;
        
        display: flex;
        flex-direction: column;
        align-items: center;

        text-align: center;
    }

    h1 {
        margin-bottom: 32px;

        font-family: 'Fraunces', serif;
        font-size: 65px;
        font-weight: 600;
        color: var(--maroon-soft);
    }

    form {
        width: 100%;

        display: flex;
        flex-direction: column;
        align-items: center;

        gap: 30px;
    }

    label {
        font-family: 'Fraunces', serif;
        font-size: 45px;
        font-weight: 450;
        color: var(--terracotta);
    }

    input {
        width: 100%;
        max-width: 400px;

        padding: 12px 16px;

        font-family: 'Inter', sans-serif;
        font-size: 18px;
        font-weight: 400;

        background: #fffaf6;
        color: var(--maroon);

        border: 1px solid var(--line);
        border-radius: 25px;

        outline: none;
        box-shadow: 0 4px 14px rgba(120, 77, 56, 0.08);

    }

    button {
        padding: 12px 24px;

        font-family: 'Fraunces', serif;
        font-size: 17px;
        font-weight: 600;
        color: #fffaf6;

        background-color: var(--marigold);
        border: none;
        border-radius: 20px;

        box-shadow: 0 4px 14px rgba(120, 77, 56, 0.08);

        cursor: pointer;
    }
    button:hover {
        background: #994b31;
    }

    #message {
        margin-top: 20px;

        font-family: 'Fraunces', serif;
        font-size: 32px;
        font-weight: 500;
        color: var(--terracotta);
    }

    @media (max-width: 600px) {
        .form-card {
            padding: 24px 18px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 24px;
        }

        label {
            font-size: 24px;
        }
        input {
            font-size: 18px;
            padding: 10px 14px;
        }
        button {
            font-size: 16px;
            padding: 10px 20px;
        }
        #message {
            font-size: 24px;
        }
    }
    </style>

    
</head>

<body>
    <div class="page-container">

        <h1>Atmiyata Mosaic</h1>

        <form id="submissionForm">
            <label for="answer">What does Atmiyata mean to you:</label>
            <input type="text"
            id="answer"
            placeholder="In a word or a sentence" 
            maxlength="50"
            required>
            <button type="submit">Submit</button>
        </form>

        <p id="message"></p>

    </div>

    <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries

        // Use shared firebase-config.js so credentials are not embedded here
        import { firebaseConfig, isConfigured } from './firebase-config.js';

        // Initialize Firebase only if a config is provided
        let app, db;
        if (isConfigured) {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } else {
            console.warn('[Atmiyata] submission.html: firebase-config.js is not configured. Submissions will be disabled.');
            const msgEl = document.getElementById('message');
            if (msgEl) msgEl.textContent = 'Submissions disabled: Firebase not configured.';
        }

    const form = document.getElementById("submissionForm");
    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const answer = document.getElementById("answer").value.trim();

        if (!answer) {
            message.textContent = "Please enter your answer before submitting.";
            return;
        }
        try {
            if (!isConfigured) {
                message.textContent = 'Submissions are disabled (no Firebase config).';
                return;
            }
            await addDoc(collection(db, "submissions"), {
                answer,
                timestamp: Date.now()
            });

            form.style.display = "none"; // Hide the form after submission

            message.textContent = ("Thank you for your submission!");

            form.reset(); // Reset the form fields

        } catch (error) {
            console.error("Error submitting answer:", error);
            message.textContent = ("There was an error submitting your answer. Please try again.");
        }
       
    });
    
    </script>
</body>
</html>
